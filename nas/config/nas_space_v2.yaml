# NAS v2 Search Space (aligned with baseline main.py constraints)
# Fixed training hyperparameters: seq_len=48, pred_len=1, batch=128, epochs=50, lr schedule Adam(0.001->0.003 OneCycle)
# Objective: minimize average validation RMSE across (PV, Net, Wind)
# Resource constraints chosen to stay below embedded target (FLOPs < 300K, Params < 20K)

meta:
  version: 2
  description: "NAS v2: lightweight temporal encoder + memory variations (Cortex-M7 target)"

fixed:
  seq_len: 48
  pred_len: 1
  batch_size: 128
  epochs: 50
  base_lr: 0.001
  max_lr: 0.003

constraints:
  max_flops: 330000      # ≤ 3.3e5 FLOPs (single inference) Option B final
  max_params: 18000      # ≤ 18K parameters (~18 KB @ INT8)
  latency_target_ms: 1.6 # Target PC proxy latency (~<1.6ms) for <2.5ms M7 est
  enforcement: hard      # hard: reject; soft: penalty (kept hard for v2 phase 1)

search_space:
  hidden_dim:
    choices: [20, 24, 28, 32, 36]              # capacity sweep around baseline
  depthwise_kernel:
    choices: [3, 5, 7, 9]          # local receptive field sweep
  dilated_layers:
    choices: [1, 2, 3]
  dilation_pattern:                # truncated for pred_len=1
    choices:
      - [1]
      - [1, 2]
      - [1, 2, 4]
      - [2, 4, 8]
      - [1, 3, 9]
      - [1, 4, 16]
  ema_decay:
    choices: [0.75, 0.80, 0.85, 0.90, 0.95]    # EMA memory length sweep
  head_dropout:
    choices: [0.0, 0.05, 0.10, 0.15]           # regularization sweep

training:
  grad_clip: 1.0
  optimizer: adam
  weight_decay: 1.0e-5
  scheduler: onecycle
  mixed_precision: false

objective:
  metric: weighted_mse  # 0.3*pv_mse + 0.3*net_mse + 0.4*wind_mse
  mode: minimize
allowed_ops:
  - depthwise_conv1d
  - pointwise_conv1d
  - conv1d_dilated
  - conv1d_standard
  - residual_add
  - simple_mlp
  - batchnorm (fusable)
  - relu
  - linear

notes:
  - ema_learnable fixed True (baseline behavior; only initial decay searched)
  - pred_len=1 so excessive receptive field depth is constrained via FLOPs/params upper bounds
  - latency enforced indirectly through FLOPs proxy (PC ms → embedded est)
  - future: introduce soft penalty score = avg_rmse + α*(params/max_params) + β*(flops/max_flops)
  - consider adding multitask weights later if wind lagging persists
